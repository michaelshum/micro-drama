services:
  - type: web
    name: micro-drama-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_STREAM_API_TOKEN
        sync: false
      - key: CLOUDFLARE_STREAM_SIGNING_KEY_ID
        sync: false
      - key: CLOUDFLARE_STREAM_SIGNING_PRIVATE_KEY
        sync: false
      - key: PLAYBACK_TOKEN_TTL_SECONDS
        value: 1800
      - key: IMAGE_TOKEN_TTL_SECONDS
        value: 86400
